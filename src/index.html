<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup de Tecnologia - Gestão de Funcionários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Gestão de Funcionários</span>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="card shadow-sm mb-4">
      <div class="card-header">
        <h2 class="h5 mb-0">Cadastro de Funcionários</h2>
      </div>
      <div class="card-body">
        <form id="formulario-funcionario" class="row g-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" pattern=".*\S.*" title="Informe o nome do funcionário" required>
          </div>
          <div class="col-md-6">
            <label for="cargo" class="form-label">Cargo</label>
            <input type="text" id="cargo" class="form-control" pattern=".*\S.*" title="Informe o cargo do funcionário" required>
          </div>
          <div class="col-md-6">
            <label for="idade" class="form-label">Idade</label>
            <input type="number" id="idade" class="form-control" min="14" max="120" step="1" required>
          </div>
          <div class="col-md-6">
            <label for="salario" class="form-label">Salário (R$)</label>
            <input type="number" id="salario" class="form-control" min="0" step="0.01" required>
          </div>
          <div class="col-12">
            <button type="submit" id="botao-salvar" class="btn btn-primary">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="btn btn-secondary" hidden>Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">
        <h2 class="h5 mb-0">Funcionários Cadastrados</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header">
        <h2 class="h5 mb-0">Relatórios</h2>
      </div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" id="botao-salario-alto" class="btn btn-outline-primary">Salário maior que R$ 5000</button>
          <button type="button" id="botao-media-salarial" class="btn btn-outline-primary">Média salarial</button>
          <button type="button" id="botao-cargos-unicos" class="btn btn-outline-primary">Cargos únicos</button>
          <button type="button" id="botao-nomes-maiusculos" class="btn btn-outline-primary">Nomes em maiúsculo</button>
        </div>
        <h3 id="titulo-relatorio" class="h6">Selecione um relatório</h3>
        <ul id="lista-relatorio" class="list-group"></ul>
      </div>
    </div>
  </main>

  <script src="js/Funcionario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
