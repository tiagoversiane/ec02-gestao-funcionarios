<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup de Tecnologia - Gestão de Funcionários</title>
</head>
<body>
  <h1>Gestão de Funcionários</h1>

  <h2>Cadastro de Funcionários</h2>
  <form id="formulario-funcionario">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" pattern=".*\S.*" title="Informe o nome do funcionário" required>
    </p>
    <p>
      <label for="idade">Idade:</label>
      <input type="number" id="idade" min="14" max="120" step="1" required>
    </p>
    <p>
      <label for="cargo">Cargo:</label>
      <input type="text" id="cargo" pattern=".*\S.*" title="Informe o cargo do funcionário" required>
    </p>
    <p>
      <label for="salario">Salário (R$):</label>
      <input type="number" id="salario" min="0" step="0.01" required>
    </p>
    <button type="submit" id="botao-salvar">Cadastrar</button>
    <button type="button" id="botao-cancelar" hidden>Cancelar</button>
  </form>

  <h2>Funcionários Cadastrados</h2>
  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Idade</th>
        <th>Cargo</th>
        <th>Salário</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
  </table>

  <script src="js/Funcionario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
